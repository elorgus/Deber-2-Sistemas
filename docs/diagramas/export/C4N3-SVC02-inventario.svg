<text x="40" y="53.2" font-size="32" font-weight="bold" fill="#172e45">Smart Inventory · Inventario</text>
<text x="40" y="84.7" font-size="17" font-weight="normal" fill="#405a72">C4 Nivel 3 · Diagrama de componentes · SVC-02 Inventario · UD-1 Núcleo transaccional</text>
<text x="360" y="168.3" font-size="20" font-weight="bold" fill="#172e45">SVC-02 Inventario</text>
<text x="1700" y="165.6" font-size="12" font-weight="bold" fill="#405a72">LÍMITE DEL MÓDULO</text>
<text x="40" y="1233.6" font-size="13" font-weight="normal" fill="#405a72">S = síncrono · A = asíncrono · OC = orden de compra · TX = transacción local · Línea discontinua = implementación de un puerto · Sin flechas hacia esquemas de otros módulos (PRI-02)</text>
