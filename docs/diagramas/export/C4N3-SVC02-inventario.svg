<text x="740" y="676.0" font-size="12" fill="#405a72" text-anchor="middle">Ordena</text>
<rect x="905.4" y="580.5" width="169.2" height="19.0" fill="#ffffff"/>
<text x="990" y="594.0" font-size="12" fill="#405a72" text-anchor="middle">TX-02 · reservar o liberar</text>
