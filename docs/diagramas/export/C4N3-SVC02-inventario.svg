<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1310" viewBox="0 0 2280 1310" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#516c85"/></marker></defs>
<rect width="2280" height="1310" fill="#f8fafc"/>
<rect x="340" y="140" width="1600" height="1060" rx="18" fill="#ffffff" stroke="#96b2cb" stroke-width="1.5"/>
<rect x="40" y="220" width="240" height="140" rx="12" fill="#edf0f5" stroke="#aab8c8" stroke-width="1.4"/>
<text x="54" y="242.7" font-size="11" font-weight="bold" fill="#405a72">TRX-02 · EXTERNA AL MÓDULO</text>
<text x="54" y="265.3" font-size="16" font-weight="bold" fill="#172e45">Capa de Aplicación</text>
<text x="54" y="288.4" font-size="13" font-weight="normal" fill="#24384c">Comandos y consultas de ROL-01</text>
<text x="54" y="304.6" font-size="13" font-weight="normal" fill="#24384c">y ROL-02.</text>
<rect x="40" y="420" width="240" height="140" rx="12" fill="#edf0f5" stroke="#aab8c8" stroke-width="1.4"/>
<text x="54" y="442.7" font-size="11" font-weight="bold" fill="#405a72">TRX-03 · EXTERNO AL MÓDULO</text>
<text x="54" y="465.3" font-size="16" font-weight="bold" fill="#172e45">Broker de eventos</text>
<text x="54" y="488.4" font-size="13" font-weight="normal" fill="#24384c">Entrada: EVT-01 a EVT-03,</text>
<text x="54" y="504.6" font-size="13" font-weight="normal" fill="#24384c">EVT-19, EVT-20, EVT-27,</text>
<text x="54" y="520.9" font-size="13" font-weight="normal" fill="#24384c">EVT-28.</text>
<rect x="40" y="620" width="240" height="140" rx="12" fill="#edf0f5" stroke="#aab8c8" stroke-width="1.4"/>
<text x="54" y="642.7" font-size="11" font-weight="bold" fill="#405a72">SVC-04 · OTRO MÓDULO</text>
<text x="54" y="665.3" font-size="16" font-weight="bold" fill="#172e45">Pedidos y Fulfillment</text>
<text x="54" y="688.4" font-size="13" font-weight="normal" fill="#24384c">PuertoReservasInventario →</text>
<text x="54" y="704.6" font-size="13" font-weight="normal" fill="#24384c">AdaptadorReservasInventario.</text>
<rect x="380" y="220" width="320" height="140" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="394" y="242.7" font-size="11" font-weight="bold" fill="#405a72">PUERTO DE ENTRADA</text>
<text x="394" y="265.3" font-size="16" font-weight="bold" fill="#172e45">RegistroMovimientos</text>
<text x="394" y="288.4" font-size="13" font-weight="normal" fill="#24384c">Recepción, transferencia, ajuste (OPS-01) y</text>
<text x="394" y="304.6" font-size="13" font-weight="normal" fill="#24384c">salida. Los movimientos son inmutables.</text>
<rect x="380" y="420" width="320" height="140" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="394" y="442.7" font-size="11" font-weight="bold" fill="#405a72">ENTRADA ASÍNCRONA</text>
<text x="394" y="465.3" font-size="16" font-weight="bold" fill="#172e45">ConsumidorIdempotente</text>
<text x="394" y="488.4" font-size="13" font-weight="normal" fill="#24384c">Procesa cada evento una sola vez y actualiza</text>
<text x="394" y="504.6" font-size="13" font-weight="normal" fill="#24384c">réplicas o activa operaciones.</text>
<rect x="380" y="620" width="320" height="140" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="394" y="642.7" font-size="11" font-weight="bold" fill="#405a72">PUERTO DE ENTRADA</text>
<text x="394" y="665.3" font-size="16" font-weight="bold" fill="#172e45">GestionReservas</text>
<text x="394" y="688.4" font-size="13" font-weight="normal" fill="#24384c">Reservar (todo o nada) y liberar. El</text>
<text x="394" y="704.6" font-size="13" font-weight="normal" fill="#24384c">disponible nunca es negativo (RNF-CON-01).</text>
<rect x="380" y="820" width="320" height="140" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="394" y="842.7" font-size="11" font-weight="bold" fill="#405a72">PUERTO DE ENTRADA (CONSULTA)</text>
<text x="394" y="865.3" font-size="16" font-weight="bold" fill="#172e45">ConsultaExistencias</text>
<text x="394" y="888.4" font-size="13" font-weight="normal" fill="#24384c">Saldo físico, reservado y disponible por SKU</text>
<text x="394" y="904.6" font-size="13" font-weight="normal" fill="#24384c">· ubicación · lote.</text>
<rect x="780" y="220" width="320" height="340" rx="12" fill="#e8f4f1" stroke="#88b5aa" stroke-width="1.4"/>
<text x="794" y="242.7" font-size="11" font-weight="bold" fill="#405a72">DATOS DE CONSULTA · SOLO LECTURA</text>
<text x="794" y="265.3" font-size="16" font-weight="bold" fill="#172e45">ReplicaCatalogo y réplicas locales</text>
<text x="794" y="288.4" font-size="13" font-weight="normal" fill="#24384c">Productos y reglas de lote · EVT-01, EVT-02</text>
<text x="794" y="304.6" font-size="13" font-weight="normal" fill="#24384c">· de SVC-01</text>
<text x="794" y="326.9" font-size="13" font-weight="normal" fill="#24384c">Ubicaciones · EVT-03 · de SVC-01</text>
<text x="794" y="349.1" font-size="13" font-weight="normal" fill="#24384c">OC pendientes de recepción · EVT-19, EVT-20</text>
<text x="794" y="365.4" font-size="13" font-weight="normal" fill="#24384c">· de SVC-03</text>
<text x="794" y="387.6" font-size="13" font-weight="normal" fill="#24384c">No se consulta a SVC-01 ni a SVC-03 en</text>
<text x="794" y="403.9" font-size="13" font-weight="normal" fill="#24384c">cada operación (PRI-04).</text>
<rect x="780" y="620" width="320" height="140" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="794" y="642.7" font-size="11" font-weight="bold" fill="#405a72">STRATEGY</text>
<text x="794" y="665.3" font-size="16" font-weight="bold" fill="#172e45">PoliticaSeleccionLotes</text>
<text x="794" y="688.4" font-size="13" font-weight="normal" fill="#24384c">PoliticaFEFO · PoliticaFIFO</text>
<text x="794" y="710.6" font-size="13" font-weight="normal" fill="#24384c">FEFO: vence antes primero; a igual fecha,</text>
<text x="794" y="726.9" font-size="13" font-weight="normal" fill="#24384c">recepción más antigua. Sin vencimiento:</text>
<text x="794" y="743.1" font-size="13" font-weight="normal" fill="#24384c">FIFO.</text>
<rect x="1180" y="220" width="320" height="740" rx="12" fill="#f6f9fc" stroke="#a5bfd7" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="1194" y="242.7" font-size="11" font-weight="bold" fill="#405a72">PUERTOS DE SALIDA</text>
<text x="1194" y="265.3" font-size="16" font-weight="bold" fill="#172e45">Persistencia transaccional</text>
<text x="1194" y="288.4" font-size="13" font-weight="normal" fill="#24384c">TX-01 recepción · TX-02 reserva · TX-03</text>
<text x="1194" y="304.6" font-size="13" font-weight="normal" fill="#24384c">salida: cambio de negocio + evento en outbox,</text>
<text x="1194" y="320.9" font-size="13" font-weight="normal" fill="#24384c">todo o nada (PRI-06).</text>
<rect x="1200" y="355" width="280" height="90" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="1214" y="377.7" font-size="11" font-weight="bold" fill="#405a72">PUERTO DE SALIDA</text>
<text x="1214" y="400.3" font-size="16" font-weight="bold" fill="#172e45">RepositorioSaldos</text>
<text x="1214" y="423.4" font-size="13" font-weight="normal" fill="#24384c">Saldos, lotes y reservas.</text>
<rect x="1200" y="465" width="280" height="90" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="1214" y="487.7" font-size="11" font-weight="bold" fill="#405a72">PUERTO DE SALIDA</text>
<text x="1214" y="510.3" font-size="16" font-weight="bold" fill="#172e45">RepositorioMovimientos</text>
<text x="1214" y="533.4" font-size="13" font-weight="normal" fill="#24384c">Movimientos, recepciones y ajustes.</text>
<rect x="1200" y="835" width="280" height="105" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="1214" y="857.7" font-size="11" font-weight="bold" fill="#405a72">PUERTO DE SALIDA</text>
<text x="1214" y="880.3" font-size="16" font-weight="bold" fill="#172e45">PublicadorEventos</text>
<text x="1214" y="903.4" font-size="13" font-weight="normal" fill="#24384c">Registra el evento dentro de la misma</text>
<text x="1214" y="919.6" font-size="13" font-weight="normal" fill="#24384c">transacción.</text>
<rect x="1180" y="1020" width="320" height="140" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="1194" y="1042.7" font-size="11" font-weight="bold" fill="#405a72">PROCESO PERIÓDICO PROPIO</text>
<text x="1194" y="1065.3" font-size="16" font-weight="bold" fill="#172e45">Detección de vencimientos</text>
<text x="1194" y="1088.4" font-size="13" font-weight="normal" fill="#24384c">Lote en umbral de días → EVT-12. Lote</text>
<text x="1194" y="1104.6" font-size="13" font-weight="normal" fill="#24384c">vencido → estado Vencido y EVT-13.</text>
<rect x="1580" y="220" width="320" height="540" rx="12" fill="#e8f4f1" stroke="#88b5aa" stroke-width="1.4"/>
<text x="1594" y="242.7" font-size="11" font-weight="bold" fill="#405a72">PROPIEDAD DEL MÓDULO</text>
<text x="1594" y="265.3" font-size="16" font-weight="bold" fill="#172e45">Esquema propio de SVC-02</text>
<text x="1594" y="288.4" font-size="13" font-weight="normal" fill="#24384c">Saldo: físico, reservado, disponible</text>
<text x="1594" y="310.6" font-size="13" font-weight="normal" fill="#24384c">Lote y fecha de vencimiento</text>
<text x="1594" y="332.9" font-size="13" font-weight="normal" fill="#24384c">Movimiento (inmutable)</text>
<text x="1594" y="355.1" font-size="13" font-weight="normal" fill="#24384c">Recepción · Ajuste</text>
<text x="1594" y="377.4" font-size="13" font-weight="normal" fill="#24384c">Reserva: Activa, Consumida, Liberada</text>
<text x="1594" y="399.6" font-size="13" font-weight="normal" fill="#24384c">Tabla Outbox</text>
<text x="1594" y="421.9" font-size="13" font-weight="normal" fill="#24384c">Credencial con permisos solo sobre este</text>
<text x="1594" y="438.1" font-size="13" font-weight="normal" fill="#24384c">esquema (PRI-02).</text>
<rect x="1580" y="820" width="320" height="140" rx="12" fill="#e5f0fb" stroke="#a5bfd7" stroke-width="1.4"/>
<text x="1594" y="842.7" font-size="11" font-weight="bold" fill="#405a72">ADAPTADOR DE SALIDA</text>
<text x="1594" y="865.3" font-size="16" font-weight="bold" fill="#172e45">PublicadorOutbox</text>
<text x="1594" y="888.4" font-size="13" font-weight="normal" fill="#24384c">Guarda el evento en la tabla Outbox y lo</text>
<text x="1594" y="904.6" font-size="13" font-weight="normal" fill="#24384c">publica en TRX-03 en orden por entidad.</text>
<rect x="2000" y="820" width="240" height="140" rx="12" fill="#edf0f5" stroke="#aab8c8" stroke-width="1.4"/>
<text x="2014" y="842.7" font-size="11" font-weight="bold" fill="#405a72">TRX-03 · EXTERNO AL MÓDULO</text>
<text x="2014" y="865.3" font-size="16" font-weight="bold" fill="#172e45">Broker de eventos</text>
<text x="2014" y="888.4" font-size="13" font-weight="normal" fill="#24384c">Mismo broker de la entrada,</text>
<text x="2014" y="904.6" font-size="13" font-weight="normal" fill="#24384c">dibujado dos veces por claridad.</text>
<rect x="2000" y="1020" width="240" height="165" rx="12" fill="#f1f5f9" stroke="#bccddd" stroke-width="1.4"/>
<text x="2014" y="1042.7" font-size="11" font-weight="bold" fill="#405a72">EVENTOS PUBLICADOS</text>
<text x="2014" y="1065.3" font-size="16" font-weight="bold" fill="#172e45">EVT-04 a EVT-13</text>
<text x="2014" y="1088.4" font-size="13" font-weight="normal" fill="#24384c">INT-07 · EVT-04, EVT-05</text>
<text x="2014" y="1110.6" font-size="13" font-weight="normal" fill="#24384c">INT-20 · EVT-08, EVT-09,</text>
<text x="2014" y="1126.9" font-size="13" font-weight="normal" fill="#24384c">EVT-05</text>
<text x="2014" y="1149.1" font-size="13" font-weight="normal" fill="#24384c">Sin INT propio: EVT-06, 07, 10</text>
<text x="2014" y="1165.4" font-size="13" font-weight="normal" fill="#24384c">a 13</text>
<rect x="380" y="1020" width="720" height="140" rx="12" fill="#f1f5f9" stroke="#bccddd" stroke-width="1.4"/>
<text x="394" y="1042.7" font-size="11" font-weight="bold" fill="#405a72">REGLAS CLAVE DE SVC-02</text>
<text x="394" y="1065.3" font-size="16" font-weight="bold" fill="#172e45">Invariantes</text>
<text x="394" y="1088.4" font-size="13" font-weight="normal" fill="#24384c">Disponible = físico − reservado; los lotes Vencido o EnCuarentena no cuentan.</text>
<text x="394" y="1110.6" font-size="13" font-weight="normal" fill="#24384c">Reserva todo o nada en el MVP; un movimiento se corrige con un ajuste, nunca se edita.</text>
<text x="394" y="1132.9" font-size="13" font-weight="normal" fill="#24384c">SVC-04 guarda solo el ID de la reserva y una copia de solo lectura de la asignación.</text>
