<text x="565" y="601.5" font-size="12" fill="#405a72" text-anchor="middle">reserva</text>
<rect x="710.0" y="462.5" width="60.0" height="19.0" fill="#ffffff"/>
<text x="740" y="476.0" font-size="12" fill="#405a72" text-anchor="middle">Actualiza</text>
